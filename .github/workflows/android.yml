name: Build Nocturne APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android source files
        run: |
          test -f App/src/main/java/com/nocturne/app/MainActivity.kt
          test -f App/src/main/java/com/nocturne/app/AlarmReceiver.kt
          test -f App/src/main/java/com/nocturne/app/AlarmScheduler.kt
          test -f App/src/main/AndroidManifest.xml
          test -f App/src/main/res/raw/soft.wav
          test -f App/src/main/res/raw/chime.wav

      - name: Build debug APK
        run: gradle :App:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-debug-apk
          path: App/build/outputs/apk/debug/*.apk
          if-no-files-found: error
